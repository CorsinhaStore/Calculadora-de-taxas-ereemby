<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Taxas</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>Calculadora de Taxas</h1>
  <p class="sub">Descobre quanto cobrar pra sobrar exatamente o valor do produto</p>

  <label for="valorProduto">Valor do produto (custo real)</label>
  <input type="number" id="valorProduto" placeholder="Ex: 10.00" step="0.01" min="0">

  <button onclick="calcular()">Calcular</button>

  <p class="erro" id="erro">Digita um valor válido maior que zero.</p>

  <div class="resultado" id="resultado">
    <div class="valor-final" id="valorFinal"></div>
    <div class="linha"><span>Custo do produto</span><span id="lCusto"></span></div>
    <div class="linha"><span>Cobrança Mystic Pay (R$1)</span><span id="lCobranca"></span></div>
    <div class="linha"><span>Saque Mystic Pay (R$1)</span><span id="lSaque"></span></div>
    <div class="linha"><span>Ereemby (4%)</span><span id="lEreemby"></span></div>
    <div class="linha"><span>Lucro (25%)</span><span id="lLucro"></span></div>
    <div class="linha"><span>Intermediadora (2%)</span><span id="lInterm"></span></div>
    <div class="linha"><span>Valor a cobrar</span><span id="lTotal"></span></div>
  </div>

  <footer class="rodape">
    <a style="color: red; href="https://crownwaves.shop/" target="_blank" rel="noopener">CrownWaves</a>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
