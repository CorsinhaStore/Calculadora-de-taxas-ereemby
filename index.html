<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Taxas - Crown Waves</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <div class="calculator-box">
      <h1 class="titulo">💰 Calculadora de Taxas</h1>
      <p class="subtitle">Informe o valor do produto e veja quanto cobrar</p>

      <div class="form-group">
        <label for="valorProduto">Valor do produto (R$)</label>
        <input type="text" id="valorProduto" placeholder="Ex: 20,00" inputmode="decimal">
      </div>

      <button class="calc-btn" onclick="calcular()">Calcular</button>

      <div class="resultado" id="resultado">
        <div class="valor-final">
          <div class="label">VALOR A COBRAR DO CLIENTE</div>
          <div class="valor" id="valorCobrar">R$ 0,00</div>
        </div>
        <div class="detalhes">
          <div class="linha"><span>Valor do produto</span><span id="dValorProduto">R$ 0,00</span></div>
          <div class="linha"><span>Taxa cobrança MysticPay (fixa)</span><span>R$ 1,00</span></div>
          <div class="linha"><span>Taxa saque MysticPay (fixa)</span><span>R$ 1,00</span></div>
          <div class="linha"><span>Ereemby (4%)</span><span id="dEreemby">R$ 0,00</span></div>
          <div class="linha"><span>Intermediadora de pagamentos (2%)</span><span id="dIntermediadora">R$ 0,00</span></div>
          <div class="linha lucro"><span>Lucro (25%)</span><span id="dLucro">R$ 0,00</span></div>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
